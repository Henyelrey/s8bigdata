name: lambda26-kafka

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: lambda26-kafka
    ports:
      - "49092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - lambda26-kafka-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: lambda26-kafka-ui
    ports:
      - "48085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: lambda26
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - lambda26-kafka-net

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    container_name: lambda26-kafka-exporter
    restart: unless-stopped
    command: ["--kafka.server=kafka:9092"]
    # Sin "ports": 49308 cae en un rango TCP reservado por Hyper-V en Windows
    # (bind forbidden). Prometheus lo alcanza por la red lambda26-kafka-net.
    depends_on:
      - kafka
    networks:
      - lambda26-kafka-net

networks:
  lambda26-kafka-net:
    name: lambda26-kafka-net
