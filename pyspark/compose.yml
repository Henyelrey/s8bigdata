name: lambda26-pyspark-red

services:
  pyspark:
    container_name: lambda26-pyspark-red
    build:
      context: .
    restart: unless-stopped
    ports:
      - "4488:8888"
      - "4042:4040"
    volumes:
      - ./sesiones:/opt
    environment:
      - JUPYTER_TOKEN=sintoken
    networks:
      - default
      - lambda26-kafka-net

networks:
  lambda26-kafka-net:
    external: true
    name: lambda26-kafka-net
