name: lambda26-obs

services:
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: lambda26-prometheus
    restart: unless-stopped
    ports:
      - "49090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - lambda26_prometheus_data:/prometheus
    networks:
      - lambda26-kafka-net

  grafana:
    image: grafana/grafana:11.4.0
    container_name: lambda26-grafana
    restart: unless-stopped
    ports:
      - "43000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Lectura anónima (rol Viewer) para ver el tablero sin login en el laboratorio local
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/s9-observabilidad.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - lambda26_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - lambda26-kafka-net

  pushgateway:
    image: prom/pushgateway:v1.11.1
    container_name: lambda26-pushgateway
    restart: unless-stopped
    ports:
      - "49091:9091"
    networks:
      - lambda26-kafka-net

volumes:
  lambda26_prometheus_data:
  lambda26_grafana_data:

networks:
  lambda26-kafka-net:
    external: true
    name: lambda26-kafka-net
